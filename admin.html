<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Securitia — Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root{--bg:#0a0e1a;--panel:#111827;--panel-2:#0f172a;--border:#1f2937;--text:#e5e7eb;--muted:#9ca3af;--accent:#6366f1;--accent-hover:#4f46e5;--cyan:#00f0ff;--success:#10b981;--error:#ef4444;--warn:#f59e0b;--mono:"JetBrains Mono",Menlo,monospace}
      *{box-sizing:border-box}
      html,body{height:100%}
      body{margin:0;font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
      button{font-family:inherit;cursor:pointer}
      a{color:var(--cyan)}
      .hidden{display:none!important}
      .btn-primary{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px}
      .btn-primary:hover{background:var(--accent-hover)}
      .btn-primary:disabled{opacity:.6;cursor:not-allowed}
      .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-size:12px}
      .btn-ghost:hover{color:var(--text);border-color:var(--accent)}
      .btn-danger{background:transparent;color:var(--error);border:1px solid rgba(239,68,68,.4);padding:6px 12px;border-radius:8px;font-size:12px}
      .btn-sm{padding:4px 10px;font-size:11px}
      input[type=password],input[type=text],input[type=number],input[type=url],textarea,select{width:100%;padding:10px 12px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;resize:vertical}
      input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
      label.lbl{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
      .status{font-size:12px;color:var(--muted)}
      .status--success{color:var(--success)}.status--error{color:var(--error)}.status--warn{color:var(--warn)}
      /* Login */
      .login-card{max-width:380px;margin:120px auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px}
      .login-card h2{margin:0 0 8px;font-size:22px}
      .login-card p{margin:0 0 20px;color:var(--muted);font-size:14px}
      .login-card button{width:100%;margin-top:12px}
      /* Shell */
      .shell{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100vh}
      .topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--border)}
      .topbar__brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.5px}
      .topbar__actions{display:flex;align-items:center;gap:10px}
      .sidebar{background:var(--panel);border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto}
      .sidebar button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:var(--muted);padding:10px 12px;border-radius:8px;font-size:13px;font-weight:500}
      .sidebar button:hover{background:var(--panel-2);color:var(--text)}
      .sidebar button.is-active{background:rgba(99,102,241,.15);color:#c7d2fe}
      .sidebar .badge{margin-left:auto;background:var(--error);color:#fff;font-size:10px;padding:1px 6px;border-radius:999px}
      .main{overflow:auto;padding:24px;min-width:0}
      .view h1{margin:0 0 4px;font-size:20px}
      .view .sub{color:var(--muted);margin:0 0 20px;font-size:13px}
      .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
      .toolbar input[type=text]{max-width:320px}
      /* Cards */
      .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
      .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
      .kpi small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
      .kpi b{font-size:24px;font-weight:800;display:block;margin-top:4px}
      .kpi span{color:var(--muted);font-size:11px}
      .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
      .panel h3{margin:0 0 12px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
      .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
      @media(max-width:1000px){.two{grid-template-columns:1fr}.shell{grid-template-columns:64px 1fr}.sidebar button span.txt{display:none}}
      /* Tables */
      table{width:100%;border-collapse:collapse;font-size:12.5px}
      th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
      th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--panel)}
      tr:hover td{background:rgba(255,255,255,.02)}
      td.mono,.mono{font-family:var(--mono);font-size:11.5px}
      .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
      .pill--A,.pill--B,.pill--ok{background:rgba(16,185,129,.15);color:#6ee7b7}
      .pill--C{background:rgba(245,158,11,.15);color:#fcd34d}
      .pill--D,.pill--F,.pill--err{background:rgba(239,68,68,.15);color:#fca5a5}
      .pill--draft{background:rgba(156,163,175,.15);color:#d1d5db}
      .pill--published{background:rgba(16,185,129,.15);color:#6ee7b7}
      .pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--muted);font-size:12px}
      .bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:10px}
      .bars div{flex:1;background:linear-gradient(180deg,var(--accent),rgba(99,102,241,.3));border-radius:3px 3px 0 0;min-height:2px;position:relative}
      .bars div:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:3px 6px;border-radius:4px;font-size:10px;white-space:nowrap;margin-bottom:4px}
      .list{list-style:none;margin:0;padding:0}
      .list li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px}
      .list li span:last-child{color:var(--muted);font-family:var(--mono)}
      .truncate{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
      /* Editor articles */
      .editor{display:grid;grid-template-columns:1fr 340px;gap:16px}
      @media(max-width:1100px){.editor{grid-template-columns:1fr}}
      .editor textarea.md{min-height:520px;font-family:var(--mono);font-size:12.5px;line-height:1.5}
      .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
      @keyframes spin{to{transform:rotate(360deg)}}
      /* Texts editor (iframe) */
      .texts{display:grid;grid-template-columns:1fr 420px;gap:0;height:calc(100vh - 56px - 48px);border:1px solid var(--border);border-radius:12px;overflow:hidden}
      .preview{position:relative;background:#05060b;border-right:1px solid var(--border)}
      .preview iframe{width:100%;height:100%;border:0;background:var(--bg)}
      .preview__hint{position:absolute;top:12px;left:12px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.35);color:#c7d2fe;padding:6px 10px;border-radius:6px;font-size:11px;pointer-events:none}
      .side{display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
      .side__header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
      .side__search{padding:10px 16px;border-bottom:1px solid var(--border)}
      .side__body{flex:1;overflow-y:auto;padding:8px 16px 80px}
      .section{border-top:1px solid var(--border);padding:12px 0}
      .section:first-child{border-top:none}
      .section__title{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
      .section__title h3{margin:0;font-size:13px;color:var(--accent)}
      .section__title small{font-size:11px;color:var(--muted);font-family:var(--mono)}
      .section__fields{margin-top:10px;display:flex;flex-direction:column;gap:10px}
      .section.is-collapsed .section__fields{display:none}
      .field{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:8px;border:1px solid transparent}
      .field.is-focused{border-color:var(--accent);background:rgba(99,102,241,.08)}
      .field.is-dirty label::after{content:" •";color:var(--warn)}
      .field label{font-size:11px;color:var(--muted);font-family:var(--mono)}
      .lang-tabs{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
      .lang-tabs button{background:transparent;border:none;color:var(--muted);padding:6px 14px;font-size:12px;font-weight:600;letter-spacing:.05em}
      .lang-tabs button.is-active{background:var(--accent);color:#fff}
      details.raw{margin-top:6px}
      details.raw pre{background:#05060b;padding:10px;border-radius:8px;font-size:11px;overflow:auto;max-height:300px}
    </style>
  </head>
  <body>
    <!-- Login -->
    <div id="login-view" class="login-card">
      <h2>🛡️ Securitia Admin</h2>
      <p>Introduce la contraseña de administración.</p>
      <form id="login-form">
        <input id="password-input" type="password" placeholder="Contraseña" autocomplete="current-password" required />
        <button class="btn-primary" type="submit">Entrar</button>
        <p id="login-error" class="status status--error" style="margin:10px 0 0"></p>
      </form>
    </div>

    <!-- App shell -->
    <div id="app" class="shell hidden">
      <div class="topbar">
        <div class="topbar__brand">🛡️ SECURITIA · Admin</div>
        <div class="topbar__actions">
          <span id="global-status" class="status"></span>
          <a href="/" target="_blank" class="btn-ghost" style="text-decoration:none">Ver web ↗</a>
          <a href="/blog" target="_blank" class="btn-ghost" style="text-decoration:none">Blog ↗</a>
          <button id="logout-btn" class="btn-ghost">Salir</button>
        </div>
      </div>
      <nav class="sidebar" id="sidebar">
        <button data-view="dashboard" class="is-active">📊 <span class="txt">Dashboard</span></button>
        <button data-view="scans">🔍 <span class="txt">Escaneos</span></button>
        <button data-view="leads">📧 <span class="txt">Leads</span></button>
        <button data-view="contacts">📬 <span class="txt">Contactos</span><span class="badge hidden" id="contacts-badge"></span></button>
        <button data-view="events">🧾 <span class="txt">Eventos</span></button>
        <button data-view="articles">📝 <span class="txt">Artículos</span></button>
        <button data-view="texts">✏️ <span class="txt">Textos web</span></button>
        <button data-view="settings">⚙️ <span class="txt">Ajustes</span></button>
      </nav>
      <main class="main" id="main"></main>
    </div>

    <script>
      // ═══════════════ Shared ═══════════════
      const TOKEN_KEY = "securitia_admin_token";
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const fmt = (d) => (d ? new Date(d.replace(" ", "T") + (d.endsWith("Z") ? "" : "Z")).toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" }) : "");
      const getToken = () => sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY);
      const setToken = (t) => { if (t) { localStorage.setItem(TOKEN_KEY, t); } else { localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); } };

      async function api(path, opts = {}) {
        const res = await fetch(path, {
          ...opts,
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${getToken()}`, ...(opts.headers || {}) },
          body: opts.body && typeof opts.body !== "string" ? JSON.stringify(opts.body) : opts.body,
        });
        if (res.status === 401) { setToken(null); showLogin("Sesión expirada, vuelve a entrar."); throw new Error("No autorizado"); }
        const ct = res.headers.get("content-type") || "";
        const data = ct.includes("json") ? await res.json() : await res.text();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        return data;
      }
      function setStatus(msg, cls = "") { const el = $("#global-status"); el.textContent = msg; el.className = `status ${cls}`; if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 5000); }

      // ═══════════════ Auth ═══════════════
      const loginView = $("#login-view"), appView = $("#app");
      function showLogin(err = "") { loginView.classList.remove("hidden"); appView.classList.add("hidden"); $("#login-error").textContent = err; $("#password-input").value = ""; $("#password-input").focus(); }
      async function showApp() { loginView.classList.add("hidden"); appView.classList.remove("hidden"); navigate(location.hash.replace("#", "") || "dashboard"); }
      $("#login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const res = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#password-input").value }) });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Error de login");
          setToken(data.token); showApp();
        } catch (err) { $("#login-error").textContent = err.message; }
      });
      $("#logout-btn").addEventListener("click", async () => { try { await api("/api/admin/logout", { method: "POST" }); } catch {} setToken(null); showLogin(); });

      // ═══════════════ Router ═══════════════
      const views = {};
      function navigate(name) {
        if (!views[name]) name = "dashboard";
        location.hash = name;
        $$("#sidebar button").forEach((b) => b.classList.toggle("is-active", b.dataset.view === name));
        const main = $("#main"); main.innerHTML = `<div class="view"><p class="sub">Cargando…</p></div>`;
        views[name](main).catch((err) => { main.innerHTML = `<div class="view"><h1>Error</h1><p class="status status--error">${esc(err.message)}</p></div>`; });
      }
      $("#sidebar").addEventListener("click", (e) => { const b = e.target.closest("button[data-view]"); if (b) navigate(b.dataset.view); });
      window.addEventListener("hashchange", () => { const n = location.hash.replace("#", ""); if (n && !$("#app").classList.contains("hidden")) navigate(n); });

      function pagerHtml(p) { return `<div class="pager"><span>${p.total} registros · pág ${p.page}/${p.pages}</span><button class="btn-ghost btn-sm" data-page="${p.page - 1}" ${p.page <= 1 ? "disabled" : ""}>←</button><button class="btn-ghost btn-sm" data-page="${p.page + 1}" ${p.page >= p.pages ? "disabled" : ""}>→</button></div>`; }

      // ═══════════════ Dashboard ═══════════════
      views.dashboard = async (main) => {
        const d = await api("/api/admin/overview");
        const badge = $("#contacts-badge"); badge.textContent = d.totals.unreadContacts; badge.classList.toggle("hidden", !d.totals.unreadContacts);
        const max = Math.max(1, ...d.daily.map((x) => x.pageviews));
        const kpi = (l, v, s = "") => `<div class="kpi"><small>${l}</small><b>${v}</b><span>${s}</span></div>`;
        main.innerHTML = `<div class="view">
          <h1>Dashboard</h1><p class="sub">BD: <span class="mono">${esc(d.dbPath)}</span> · uptime ${Math.round(d.uptime / 60)} min</p>
          <div class="cards">
            ${kpi("Visitas (total)", d.totals.pageviews, `${d.last24h.pageviews} últimas 24h`)}
            ${kpi("Visitantes únicos 30d", d.totals.visitors30d)}
            ${kpi("Escaneos", d.totals.scans, `${d.last24h.scans} últimas 24h`)}
            ${kpi("Leads", d.totals.leads, `${d.last24h.leads} últimas 24h`)}
            ${kpi("Pagados", d.totals.paid)}
            ${kpi("Contactos", d.totals.contacts, `${d.totals.unreadContacts} sin leer`)}
            ${kpi("Artículos", d.totals.articles, `${d.totals.drafts} borradores`)}
          </div>
          <div class="panel"><h3>Últimos 30 días — visitas / escaneos / leads</h3>
            <div class="bars">${d.daily.map((x) => `<div style="height:${Math.round((x.pageviews / max) * 100)}%" data-tip="${x.day}: ${x.pageviews} visitas · ${x.scans} escaneos · ${x.leads} leads"></div>`).join("")}</div>
          </div>
          <div class="two">
            <div class="panel"><h3>Páginas más vistas (30d)</h3><ul class="list">${d.topPages.map((p) => `<li><span class="truncate">${esc(p.path)}</span><span>${p.n}</span></li>`).join("") || "<li>Sin datos</li>"}</ul></div>
            <div class="panel"><h3>Referrers (30d)</h3><ul class="list">${d.topReferrers.map((p) => `<li><span class="truncate">${esc(p.referrer)}</span><span>${p.n}</span></li>`).join("") || "<li>Sin datos</li>"}</ul></div>
            <div class="panel"><h3>Dominios más escaneados</h3><ul class="list">${d.topScannedDomains.map((p) => `<li><span class="truncate">${esc(p.url)}</span><span>${p.n}</span></li>`).join("") || "<li>Sin datos</li>"}</ul></div>
            <div class="panel"><h3>Distribución de puntuación</h3><ul class="list">${d.scoreDistribution.map((p) => `<li><span class="pill pill--${p.score}">${p.score}</span><span>${p.n}</span></li>`).join("") || "<li>Sin datos</li>"}</ul></div>
          </div>
          <div class="panel"><h3>Actividad reciente</h3>
            <table><thead><tr><th>Fecha</th><th>Tipo</th><th>Ruta</th><th>IP</th><th>Detalle</th></tr></thead><tbody>
            ${d.recentEvents.map((e) => `<tr><td class="mono">${fmt(e.created_at)}</td><td>${esc(e.type)}</td><td class="mono truncate">${esc(e.path || "")}</td><td class="mono">${esc(e.ip || "")}</td><td class="mono truncate">${esc(e.meta_json || e.referrer || "")}</td></tr>`).join("")}
            </tbody></table></div>
        </div>`;
      };

      // ═══════════════ Generic list views ═══════════════
      function listView({ title, sub, endpoint, exportName, columns, rowHtml, onClick }) {
        return async (main, state = { page: 1, q: "" }) => {
          const p = await api(`${endpoint}?page=${state.page}&q=${encodeURIComponent(state.q)}`);
          main.innerHTML = `<div class="view"><h1>${title}</h1><p class="sub">${sub}</p>
            <div class="toolbar"><input type="text" id="q" placeholder="Buscar…" value="${esc(state.q)}" /><button class="btn-ghost" id="search">Buscar</button>
            ${exportName ? `<a class="btn-ghost" style="text-decoration:none" href="/api/admin/export/${exportName}.csv?token=${getToken()}">Exportar CSV</a>` : ""}</div>
            <div class="panel" style="padding:0;overflow:auto"><table><thead><tr>${columns.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${p.rows.map(rowHtml).join("") || `<tr><td colspan="${columns.length}" style="color:var(--muted)">Sin registros todavía</td></tr>`}</tbody></table></div>
            ${pagerHtml(p)}</div>`;
          const rerun = (s) => views[location.hash.replace("#", "")](main, s);
          $("#search").onclick = () => rerun({ page: 1, q: $("#q").value });
          $("#q").onkeydown = (e) => { if (e.key === "Enter") rerun({ page: 1, q: $("#q").value }); };
          $$("[data-page]").forEach((b) => (b.onclick = () => rerun({ ...state, page: +b.dataset.page })));
          if (onClick) main.onclick = (e) => onClick(e, () => rerun(state));
        };
      }

      views.scans = listView({
        title: "Escaneos", sub: "Cada URL analizada por los usuarios, con IP, origen y resultado.", endpoint: "/api/admin/scans", exportName: "scans",
        columns: ["Fecha", "URL", "Score", "Crít.", "Avisos", "OK", "ms", "IP", "Referrer", ""],
        rowHtml: (s) => `<tr><td class="mono">${fmt(s.created_at)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener" class="truncate">${esc(s.url)}</a></td><td><span class="pill pill--${s.score}">${s.score}</span></td><td>${s.critical_count}</td><td>${s.warning_count}</td><td>${s.passed_count}</td><td class="mono">${s.duration_ms ?? ""}</td><td class="mono">${esc(s.ip || "")}</td><td class="mono truncate" style="max-width:160px">${esc(s.referrer || "")}</td><td><button class="btn-ghost btn-sm" data-scan="${s.id}">Ver</button></td></tr>`,
        onClick: async (e) => {
          const b = e.target.closest("[data-scan]"); if (!b) return;
          const s = await api(`/api/admin/scans/${b.dataset.scan}`);
          const tr = b.closest("tr"); const next = tr.nextElementSibling;
          if (next && next.classList.contains("detail")) { next.remove(); return; }
          const row = document.createElement("tr"); row.className = "detail";
          row.innerHTML = `<td colspan="10"><ul class="list">${s.results.map((r) => `<li><span>${r.severity === "critical" ? "🔴" : r.severity === "warning" ? "🟡" : "🟢"} <b>${esc(r.name)}</b> — ${esc(r.description)}${r.recommendation ? `<br><small style="color:var(--cyan)">💡 ${esc(r.recommendation)}</small>` : ""}</span><span>${r.free ? "free" : "premium"}</span></li>`).join("")}</ul><div class="mono" style="color:var(--muted);margin-top:8px">UA: ${esc(s.user_agent || "")}</div></td>`;
          tr.after(row);
        },
      });

      views.leads = listView({
        title: "Leads", sub: "Usuarios que pidieron el informe por email. Se guardan aunque falle el envío.", endpoint: "/api/admin/leads", exportName: "leads",

      const SECTIONS = [

        const saveBtn = $("#save-btn"), reloadBtn = $("#reload-btn"), saveStatus = $("#save-status"), sectionsRoot = $("#sections"), previewFrame = $("#preview-frame"), langTabs = $("#lang-tabs"), searchInput = $("#search-input"), dirtyCount = $("#dirty-count");
        let currentLang = "es"; const serverTexts = { es: {}, en: {} }; const localEdits = { es: {}, en: {} };
        const currentValue = (key) => (key in localEdits[currentLang] ? localEdits[currentLang][key] : serverTexts[currentLang][key] || "");
        async function loadLang(lang) { currentLang = lang; updateLangTabs(); saveStatus.textContent = "Cargando…"; const payload = await (await fetch(`/api/texts?lang=${lang}`)).json(); serverTexts[lang] = payload.texts || payload; renderSections(); refreshIframe(); saveStatus.textContent = ""; updateDirty(); }
        function updateLangTabs() { $$("button", langTabs).forEach((b) => b.classList.toggle("is-active", b.dataset.lang === currentLang)); }
        langTabs.addEventListener("click", (e) => { const btn = e.target.closest("button[data-lang]"); if (!btn || btn.dataset.lang === currentLang) return; const lang = btn.dataset.lang; if (!Object.keys(serverTexts[lang]).length) loadLang(lang); else { currentLang = lang; updateLangTabs(); renderSections(); refreshIframe(); updateDirty(); } });
        function refreshIframe() { previewFrame.src = `/?admin=1&lang=${currentLang}&t=${Date.now()}`; }
        function renderSections() {

          for (const section of SECTIONS) {
            const sectionKeys = keys.filter((k) => k.startsWith(section.prefix)); if (!sectionKeys.length) continue;
            const filtered = filter ? sectionKeys.filter((k) => k.toLowerCase().includes(filter) || currentValue(k).toLowerCase().includes(filter)) : sectionKeys; if (!filtered.length) continue;
            const sec = document.createElement("div"); sec.className = "section";
            sec.innerHTML = `<div class="section__title"><h3>${section.title}</h3><small>${section.prefix}*</small></div><div class="section__fields"></div>`;

            for (const key of filtered) {
              const value = currentValue(key); const field = document.createElement("div"); field.className = "field"; field.dataset.key = key; if (key in localEdits[currentLang]) field.classList.add("is-dirty");
              field.innerHTML = `<label>${key}</label>${value.length > 60 ? `<textarea data-key="${key}" rows="3"></textarea>` : `<input type="text" data-key="${key}" />`}`;
              const control = field.querySelector("[data-key]"); control.value = value;
              control.addEventListener("focus", () => { $$(".field.is-focused").forEach((f) => f.classList.remove("is-focused")); field.classList.add("is-focused"); postToIframe({ type: "securitia:focusText", key }); });
              control.addEventListener("input", () => { setLocal(key, control.value); postToIframe({ type: "securitia:setText", key, value: control.value }); });
              fieldsEl.appendChild(field);
            }
            sectionsRoot.appendChild(sec);
          }
        }
        function setLocal(key, value) { const saved = serverTexts[currentLang][key] || ""; if (value === saved) delete localEdits[currentLang][key]; else localEdits[currentLang][key] = value; const field = $(`.field[data-key="${key}"]`); if (field) field.classList.toggle("is-dirty", key in localEdits[currentLang]); updateDirty(); }
        function updateDirty() { const total = Object.keys(localEdits.es).length + Object.keys(localEdits.en).length; dirtyCount.textContent = total ? `${total} cambio${total > 1 ? "s" : ""} sin guardar` : ""; dirtyCount.className = total ? "status status--warn" : "status"; }
        function postToIframe(msg) { previewFrame.contentWindow && previewFrame.contentWindow.postMessage(msg, "*"); }
        const onMsg = (event) => {
          const msg = event.data; if (!msg || typeof msg !== "object") return;
          if (msg.type === "securitia:ready") { for (const [key, value] of Object.entries(localEdits[currentLang])) postToIframe({ type: "securitia:setText", key, value }); }
          else if (msg.type === "securitia:edit" || msg.type === "securitia:input") { if (msg.lang && msg.lang !== currentLang) return; const control = $(`.field[data-key="${msg.key}"] [data-key]`); if (control) control.value = msg.value; setLocal(msg.key, msg.value); }
          else if (msg.type === "securitia:select") { const field = $(`.field[data-key="${msg.key}"]`); if (!field) return; $$(".field.is-focused").forEach((f) => f.classList.remove("is-focused")); field.classList.add("is-focused"); field.scrollIntoView({ behavior: "smooth", block: "center" }); const c = field.querySelector("[data-key]"); if (c) c.focus(); }
        };
        window.addEventListener("message", onMsg);
        searchInput.addEventListener("input", renderSections);
        saveBtn.addEventListener("click", async () => {
          const langsToSave = ["es", "en"].filter((l) => Object.keys(localEdits[l]).length); if (!langsToSave.length) { saveStatus.textContent = "Nada que guardar"; return; }
          saveBtn.disabled = true; saveStatus.textContent = "Guardando…"; saveStatus.className = "status";
          try { for (const lang of langsToSave) { const data = await api("/api/admin/texts", { method: "PUT", body: { lang, texts: localEdits[lang] } }); serverTexts[lang] = data.texts; localEdits[lang] = {}; } renderSections(); updateDirty(); saveStatus.textContent = "✅ Cambios guardados"; saveStatus.className = "status status--success"; }
          catch (err) { saveStatus.textContent = `❌ ${err.message}`; saveStatus.className = "status status--error"; } finally { saveBtn.disabled = false; }
        });
        reloadBtn.addEventListener("click", () => { const dirty = Object.keys(localEdits.es).length + Object.keys(localEdits.en).length; if (dirty && !confirm("Tienes cambios sin guardar. ¿Descartarlos?")) return; localEdits.es = {}; localEdits.en = {}; loadLang(currentLang); });
        loadLang("es");
      };

      // ═══════════════ Boot ═══════════════
      (async () => {
        if (getToken()) { try { await api("/api/admin/me"); return showApp(); } catch {} }
        showLogin();
      })();
    </script>
  </body>
</html>
